name: Checks
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: paperstreet-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Verify trade ledger
        run: python3 tests/database_test.py
      - name: Type check and build
        run: npm run build
